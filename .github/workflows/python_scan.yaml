# .github/workflows/python-scan.yaml
name: CI - Python Checks & Security

on:
  push:
    branches:
      - main
      - dev
      - stage
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main
      - dev
      - stage
      - "feature/**"
      - "bugfix/**"
jobs:
  python-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Bandit (SAST)
        run: pip install bandit && bandit -r .

      - name: Run Safety vulnerability scan
        run: pip install safety && safety scan || echo "⚠️ Safety found vulnerabilities"

      - name: Run pip-audit (Dependency CVE scan)
        run: pip install pip-audit && pip-audit || echo "⚠️ pip-audit found vulnerabilities"