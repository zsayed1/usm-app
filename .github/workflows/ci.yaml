name: CI - Validate and Scan App

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          pip --version


      - name: Install dependencies and run tests
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pytest || echo "⚠️ No tests found or some failed (non-blocking for CI)"

      # ---------------------------
      #  Python Security Scans
      # ---------------------------

      - name: Install Python security tools
        run: |
          pip install bandit pip-audit safety

      - name: Run Bandit (SAST)
        run: bandit -r .

      # - name: Run pip-audit (Dependency CVE scan)
      #   run: pip-audit

      - name: Run Safety vulnerability scan
        run: |
          pip install safety
          safety scan || echo "⚠️ Safety found vulnerabilities"

      # ---------------------------
      # 🐳 Docker build validation
      # ---------------------------

      - name: Build Docker image (test only)
        run: docker build -t test-usm-app .

      # ---------------------------
      # ⚓ Helm and Kubernetes Scans
      # ---------------------------

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint charts/usm-app

      - name: Install Checkov for Helm scan
        run: pip install checkov

      - name: Run Checkov on Helm chart
        run: checkov -d charts/usm-app || echo "⚠️ Checkov found issues"

      # - name: Install KubeLinter
      #   run: |
      #     KUBE_LINTER_VERSION=$(curl -s https://api.github.com/repos/stackrox/kube-linter/releases/latest | jq -r .tag_name)
      #     curl -L "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-${KUBE_LINTER_VERSION}-linux-amd64.tar.gz" -o kube-linter.tar.gz
      #     tar -xzf kube-linter.tar.gz
      #     sudo mv kube-linter /usr/local/bin/kube-linter


      # - name: Run kube-linter on Helm manifests
      #   run: kube-linter lint charts/usm-app || echo "⚠️ kube-linter found issues"

      # ---------------------------
      # 🔑 Secrets Scan (optional but recommended)
      # ---------------------------

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
