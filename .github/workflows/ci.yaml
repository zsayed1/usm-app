name: CI - Python & Docker + Helm

on:
  push:
    branches:
      - "**"

jobs:
  python-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install tools
        run: pip install bandit safety
      - name: Run Bandit
        run: bandit -r .
      - name: Run Safety
        run: safety scan || echo "⚠️ Safety issues"

  docker-helm:
    runs-on: ubuntu-latest
    needs: python-scan
    if: ${{ needs.python-scan.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t test-usm-app .
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint charts/usm-apps
