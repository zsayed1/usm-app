name: CI - Docker Build & Helm Validation

on:
  workflow_run:
    workflows: ["CI - Python Checks & Security"]
    types:
      - completed

jobs:
  docker-helm:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐳 Build Docker image (test only) with caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (test build only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false                   # ✅ Do NOT push on every commit
          tags: test-usm-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move updated Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ⚓ Helm validation
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint charts/usm-app

      # 🛡️ Optional: Static security scan for Helm manifests
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Helm chart
        run: checkov -d charts/usm-app || echo "⚠️ Checkov found issues"
