name: CD - Build & Push Docker Image & Helm Chart

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: usm-app
  HELM_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com/helm
  CHART_PATH: charts/usm-app

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables based on branch
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "IMAGE_TAG=prod-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "CHART_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "CHART_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/internal-dev-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Expose ECR registry to later steps
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Build & push Docker image
        run: |
          echo "Building image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Login to Helm ECR registry
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login "$HELM_REGISTRY" --username AWS --password-stdin

      - name: Update Helm values.yaml (repo & tag)
        run: |
          # Update tag
          sed -i 's|tag: ".*"|tag: "'"$IMAGE_TAG"'"|' "$CHART_PATH/values.yaml"
          # Update repository (ensures it matches account/region)
          sed -i 's|repository: ".*"|repository: "'"$ECR_REGISTRY/$ECR_REPOSITORY"'"|' "$CHART_PATH/values.yaml"

      - name: Update Helm chart version & appVersion
        run: |
          sed -i 's|^version:.*|version: '"$CHART_VERSION"'|' "$CHART_PATH/Chart.yaml"
          sed -i 's|^appVersion:.*|appVersion: "'"$IMAGE_TAG"'"|' "$CHART_PATH/Chart.yaml"

      - name: Package Helm chart
        run: |
          helm lint "$CHART_PATH"
          mkdir -p packaged
          helm package "$CHART_PATH" --destination packaged
          echo "Packaged charts:"
          ls -l packaged

      - name: Push Helm chart to ECR (OCI)
        run: |
          CHART_FILE=$(ls packaged/usm-app-*.tgz)
          echo "Pushing chart $CHART_FILE to oci://$HELM_REGISTRY"
          helm push "$CHART_FILE" "oci://$HELM_REGISTRY"
