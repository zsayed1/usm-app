name: CD - Build & Push Docker Image & Helm Chart

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com
  ECR_APP_REPOSITORY: test-app-repo
  HELM_REPOSITORY: 879381282588.dkr.ecr.us-east-1.amazonaws.com
  CHART_PATH: charts/helm-usm-app

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 🧪 Step 1: Debug OIDC Token Claims
      - name: 🧪 Inspect OIDC Token Claims (for troubleshooting)
        run: |
          echo "Requesting OIDC token..."
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          echo "🔐 Decoded OIDC claims:"
          echo $TOKEN | jq -r '.claims'
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}

      # 🛠️ Set image tag based on branch or .env version
      - name: 📌 Set image version
        run: |
          BRANCH="${GITHUB_REF##*/}"
          VERSION=$(grep '^APP_VERSION=' .env | cut -d '=' -f2)
          echo "Using APP_VERSION=$VERSION"
          if [ "$BRANCH" = "main" ]; then
            echo "IMAGE_TAG=prod-${VERSION}" >> $GITHUB_ENV
            echo "CHART_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${VERSION}" >> $GITHUB_ENV
            echo "CHART_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      # 🔐 OIDC Auth – main suspect if AssumeRole fails
      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/test-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR (Docker)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Expose ECR registry
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      # 🐳 Build and push image
      - name: 🐳 Build & Push Docker Image
        run: |
          echo "🚀 Building image: $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG"

      # ⚓ Helm Package & Push
      - name: ⚓ Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: 📦 Package & Push Helm Chart
        run: |
          mkdir -p packaged
          helm package $CHART_PATH --version "$CHART_VERSION" --destination packaged
          CHART_FILE=$(ls packaged/helm-usm-app-*.tgz)
          echo "📤 Pushing Helm chart: $CHART_FILE to oci://$HELM_REPOSITORY"
          helm push $CHART_FILE oci://$HELM_REPOSITORY