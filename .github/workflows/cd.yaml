name: CD - Build & Push Docker Image & Helm Chart

on:
  push:
    branches:
      - "**"
      # - dev
      # - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com
  ECR_APP_REPOSITORY: usm-app
  HELM_REPOSITORY: 879381282588.dkr.ecr.us-east-1.amazonaws.com
  CHART_PATH: charts/helm-usm-app

jobs:
  # 🐳 Docker Build & Push
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📄 Load environment variables from .env
        run: |
          set -a
          source .env
          set +a
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/test-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR (Docker)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & push Docker image
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_APP_REPOSITORY:$APP_VERSION"
          echo "🚀 Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

  # ⚓ Helm Package & Push
  helm-package-push:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: ${{ needs.docker-build-push.result == 'success' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📄 Load environment variables from .env
        run: |
          set -a
          source .env
          set +a
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/test-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ⚓ Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: 📦 Package & push Helm chart
        run: |
          mkdir -p packaged
          helm package $CHART_PATH --version "$APP_VERSION" --destination packaged
          CHART_FILE=$(ls packaged/helm-usm-app-*.tgz)
          echo "📦 Pushing $CHART_FILE to oci://$HELM_REPOSITORY"
          helm push $CHART_FILE oci://$HELM_REPOSITORY
