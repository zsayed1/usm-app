name: CD - Build & Push Docker Image & Helm Chart

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: usm-app
  HELM_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com/helm
  CHART_PATH: charts/usm-app

permissions:
  id-token: write
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 📥 Checkout code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 🔐 Configure AWS OIDC credentials
      # ---------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/internal-dev-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------
      # 🔑 Login to ECR
      # ---------------------------
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------
      # 🔁 Auto-bump APP_VERSION in .env
      # ---------------------------
      - name: Bump version in .env
        run: |
          NEW_TAG="v0.1.${{ github.run_number }}"
          if [ -f .env ]; then
            sed -i "s/^APP_VERSION=.*/APP_VERSION=${NEW_TAG}/" .env
          else
            echo "APP_VERSION=${NEW_TAG}" >> .env
          fi
          cat .env

      # ---------------------------
      # 📖 Read the version tag
      # ---------------------------
      - name: Read version tag
        id: envvars
        run: echo "TAG=$(grep 'APP_VERSION' .env | cut -d'=' -f2)" >> $GITHUB_ENV

      # ---------------------------
      # 🐳 Build & Push Docker image
      # ---------------------------
      - name: Build & Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${TAG} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${TAG}

          # ✅ Also push as 'latest'
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${TAG} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # ---------------------------
      # ⚙️ Update Helm values.yaml with new image tag
      # ---------------------------
      - name: Update Helm values.yaml
        run: sed -i "s/tag: \".*\"/tag: \"${TAG}\"/" $CHART_PATH/values.yaml

      # ---------------------------
      # ⚓ Set up Helm
      # ---------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # ---------------------------
      # 🔑 Login to Helm ECR registry
      # ---------------------------
      - name: Login to Helm ECR registry
        run: |
          aws ecr get-login-password --region $AWS_REGION | helm registry login $HELM_REGISTRY --username AWS --password-stdin

      # ---------------------------
      # 📦 Package and Push Helm chart
      # ---------------------------
      - name: Package and push Helm chart
        run: |
          mkdir -p packaged
          helm package $CHART_PATH --destination packaged
          CHART_FILE=$(ls packaged/usm-app-*.tgz)
          echo "📦 Pushing $CHART_FILE to oci://$HELM_REGISTRY"
          helm push $CHART_FILE oci://$HELM_REGISTRY
