name: CD - Build & Push Docker & Helm (Post-Merge)

on:
  push:
    branches:
      - dev
      - stage
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: usm-app
  HELM_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com/helm
  CHART_PATH: charts/usm-app

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------
  # 🐳 Build & Push Docker Image
  # ---------------------------
  docker-build-push:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/internal-dev-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔁 Bump version in .env
        run: |
          NEW_TAG="v0.1.${{ github.run_number }}"
          if [ -f .env ]; then
            sed -i "s/^APP_VERSION=.*/APP_VERSION=${NEW_TAG}/" .env
          else
            echo "APP_VERSION=${NEW_TAG}" >> .env
          fi
          cat .env

      - name: 📖 Read version tag
        id: envvars
        run: echo "TAG=$(grep 'APP_VERSION' .env | cut -d'=' -f2)" >> $GITHUB_ENV

      - name: 🐳 Build & Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${TAG} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${TAG}
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${TAG} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ---------------------------
  # ⚓ Package & Push Helm Chart
  # ---------------------------
  helm-package-push:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: ${{ needs.docker-build-push.result == 'success' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Update Helm values.yaml with new image tag
        run: |
          sed -i "s/tag: .*/tag: \"${TAG}\"/" ${CHART_PATH}/values.yaml
          echo "✅ Updated values.yaml to use image tag: ${TAG}"

      - name: ⚓ Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: 🔑 Login to Helm ECR registry
        run: |
          aws ecr get-login-password --region $AWS_REGION | helm registry login $HELM_REGISTRY --username AWS --password-stdin

      - name: 📦 Package and push Helm chart
        run: |
          mkdir -p packaged
          helm package $CHART_PATH --destination packaged
          CHART_FILE=$(ls packaged/usm-app-*.tgz)
          echo "📦 Pushing $CHART_FILE to oci://$HELM_REGISTRY"
          helm push $CHART_FILE oci://$HELM_REGISTRY
