name: CD - Build & Push Docker Image & Helm Chart

# on:
#   push:
#     branches:
#       - dev
#       - master
#   workflow_dispatch:

on:
  push:
    branches:
      - "**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com
  ECR_APP_REPOSITORY: usm-app
  HELM_REPOSITORY: 879381282588.dkr.ecr.us-east-1.amazonaws.com/helm-usm-app
  CHART_PATH: charts/helm-usm-app   # 👈 updated to match new chart directory name

jobs:
  # 🐳 Docker Build & Push
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📌 Set variables based on branch
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "master" ]; then
            echo "IMAGE_TAG=prod-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "CHART_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "CHART_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/usm-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR (Docker)
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & push Docker image
        run: |
          echo "🚀 Building image: $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG"

          # Optional: Tag latest ONLY for master builds
          if [ "$BRANCH" = "master" ]; then
            docker tag "$ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_APP_REPOSITORY:latest"
            docker push "$ECR_REGISTRY/$ECR_APP_REPOSITORY:latest"
          fi

  # ⚓ Helm Package & Push
  helm-package-push:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: ${{ needs.docker-build-push.result == 'success' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Update Helm values.yaml with new image tag
        run: |
          sed -i 's|tag: ".*"|tag: "'"$IMAGE_TAG"'"|' ${CHART_PATH}/values.yaml
          echo "✅ Updated Helm values.yaml with tag: $IMAGE_TAG"

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/usm-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR (Helm)
        run: |
          aws ecr get-login-password --region $AWS_REGION | helm registry login \
            --username AWS --password-stdin $ECR_REGISTRY

      - name: ⚓ Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: 📦 Package & push Helm chart (OCI)
        run: |
          mkdir -p packaged
          helm package $CHART_PATH --version "$CHART_VERSION" --destination packaged

          CHART_FILE=$(ls packaged/helm-usm-app-*.tgz)
          echo "📦 Chart file: $CHART_FILE"
          echo "📤 Pushing chart to oci://$HELM_REPOSITORY"

          helm push $CHART_FILE oci://$HELM_REPOSITORY
