name: CD - Build & Push Image & Helm

on:
  push:
    branches:
      - dev
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: usm-app
  HELM_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com/helm
  CHART_PATH: charts/usm-app
  IMAGE_TAG: v0.1.${{ github.run_number }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/internal-dev-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

      - name: Update Helm values.yaml with new image tag
        run: sed -i "s/tag: \".*\"/tag: \"${IMAGE_TAG}\"/" $CHART_PATH/values.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Login to Helm ECR registry
        run: |
          aws ecr get-login-password --region $AWS_REGION | helm registry login $HELM_REGISTRY --username AWS --password-stdin

      - name: Package and push Helm chart
        run: |
          helm package $CHART_PATH --destination packaged
          CHART_FILE=$(ls packaged/usm-app-*.tgz)
          helm push $CHART_FILE oci://$HELM_REGISTRY
