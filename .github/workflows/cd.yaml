name: CD - Build & Push Docker Image & Helm Chart

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: usm-app
  HELM_REGISTRY: 879381282588.dkr.ecr.us-east-1.amazonaws.com/helm
  CHART_PATH: charts/usm-app

jobs:
  # ---------------------------
  # 🐳 Docker Build & Push
  # ---------------------------
  docker-build-push:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📌 Set variables based on branch
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "IMAGE_TAG=prod-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "CHART_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
            echo "CHART_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381282588:role/internal-dev-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Expose ECR registry
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: 🐳 Build & push Docker image
        run: |
          echo "🚀 Building image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # ---------------------------
  # ⚓ Helm Package & Push
  # ---------------------------
  helm-package-push:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: ${{ needs.docker-build-push.result == 'success' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Update Helm values.yaml
        run: |
          sed -i 's|tag: ".*"|tag: "'"$IMAGE_TAG"'"|' ${CHART_PATH}/values.yaml
          echo "✅ Updated Helm values.yaml with tag: $IMAGE_TAG"

      - name: ⚓ Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: 🔑 Login to Helm ECR registry
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login "$HELM_REGISTRY" --username AWS --password-stdin

      - name: 📦 Package & push Helm chart
        run: |
          mkdir -p packaged
          helm package $CHART_PATH --version "$CHART_VERSION" --destination packaged
          CHART_FILE=$(ls packaged/usm-app-*.tgz)
          echo "📦 Pushing $CHART_FILE to oci://$HELM_REGISTRY"
          helm push $CHART_FILE oci://$HELM_REGISTRY
