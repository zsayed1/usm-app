apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usm-app.fullname" . }}
  labels:
    {{- include "usm-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "usm-app.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "usm-app.name" . }}
    spec:
      containers:
        - name: {{ include "usm-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
